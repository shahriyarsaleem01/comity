name: Build Release APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Ensure persistent signing keystore
        run: |
          if [ ! -f android/app/comity.keystore ]; then
            keytool -genkeypair -v -keystore android/app/comity.keystore -alias comity -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Comity, OU=Comity, O=Comity, L=Karachi, ST=Sindh, C=PK"
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add android/app/comity.keystore
            git commit -m "Add persistent signing keystore"
            git push origin HEAD:main
          fi
      - name: Print app SHA fingerprints (add SHA-1 to Firebase console)
        run: |
          echo "================ COPY THE SHA-1 BELOW INTO FIREBASE ================"
          keytool -list -v -keystore android/app/comity.keystore -alias comity -storepass android | grep -E "SHA1|SHA256"
          echo "===================================================================="
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/*.apk